
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # O la rama que uses para tu código fuente principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Puedes usar una versión de Node.js específica

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }} # Usa un secreto de GitHub para la API Key

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }} # Solo despliega desde la rama principal
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Directorio de salida de Vite
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy GitHub Pages'
