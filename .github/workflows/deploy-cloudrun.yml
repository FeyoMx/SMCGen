name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main # O la rama que uses para tu código fuente principal

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }} # Ej: generador-de-contenido-para-redes-sociales
  REGION: ${{ secrets.GCP_REGION }} # Ej: us-west1
  ARTIFACT_REGISTRY_REPOSITORY: 'cloud-run-repo' # Puedes cambiarlo si ya tienes uno, o se creará.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: 'Authenticate to Google Cloud'
        id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Configure Docker to use Artifact Registry'
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev

      - name: 'Build and push Docker image'
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }} .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v1'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}
          env_vars: |
            API_KEY=${{ secrets.GEMINI_API_KEY }} # Pasa la API Key como variable de entorno
          # Si necesitas más configuraciones para Cloud Run, añádelas aquí.
          # Por ejemplo:
          # no_allow_unauthenticated: false # Permite acceso no autenticado (si tu servicio es público)
          # concurrency: 80
          # cpu: 1
          # memory: 512Mi
          # timeout: 300
    