name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main # O la rama que uses para tu código fuente principal

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }} # Ej: generador-de-contenido-para-redes-sociales
  REGION: ${{ secrets.GCP_REGION }} # Ej: us-west1
  ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }} # Ej: cloud-run-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Necesario para la autenticación en Google Cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: 'Authenticate to Google Cloud'
        id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Configure Docker to use Artifact Registry'
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: 'Build and push Docker image to Artifact Registry'
        run: |
          docker build \
            --build-arg API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }} .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v1'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            API_KEY=${{ secrets.GEMINI_API_KEY }} # Pasa la API Key como variable de entorno al servicio de Cloud Run (runtime)
          allow_unauthenticated: true # Permite acceso no autenticado al servicio de Cloud Run
          # Puedes añadir otras configuraciones de Cloud Run aquí, por ejemplo:
          # concurrency: 80
          # cpu: 1
          # memory: 512Mi
          # timeout: 300